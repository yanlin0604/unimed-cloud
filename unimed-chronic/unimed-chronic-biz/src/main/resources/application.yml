# Tomcat
server:
  port: 9208

# Spring
spring:
  application:
    # 应用名称
    name: unimed-chronic
  profiles:
    # 环境配置
    active: @profiles.active@

chronic:
  datasource:
    # 默认主数据源使用独立慢病库
    primary-db: unimed-chronic
    # 系统库只允许通过只读方式兜底查询
    system-read-enabled: true
    # 服务启动时要求 nacos 中存在 chronic 与 system-master 两组库连接信息
    required-configs:
      - datasource.chronic
      - datasource.system-master

  ocr:
    baidu:
      enabled: false
      app-id: ${BAIDU_OCR_APP_ID:}
      api-key: ${BAIDU_OCR_API_KEY:}
      secret-key: ${BAIDU_OCR_SECRET_KEY:}
      connect-timeout: 3000
      read-timeout: 10000
      max-file-size: 10485760

--- # nacos 配置
spring:
  cloud:
    nacos:
      # nacos 服务地址
      server-addr: @nacos.server@
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        # 注册组
        group: @nacos.discovery.group@
        namespace: ${spring.profiles.active}
      config:
        # 配置组
        group: @nacos.config.group@
        namespace: ${spring.profiles.active}
  config:
    import:
      - optional:nacos:application-common.yml
      - optional:nacos:datasource.yml
      - optional:nacos:${spring.application.name}.yml

