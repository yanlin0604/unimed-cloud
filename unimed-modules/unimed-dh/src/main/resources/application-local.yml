# 数字人服务本地配置文件
server:
  port: 9205

spring:
  application:
    name: unimed-dh
  profiles:
    active: local

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 1  # 使用不同的数据库
      timeout: 10s
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          max-idle: 10
          min-idle: 0

  # 数据源配置（如果需要数据库，取消注释）
  # datasource:
  #   type: com.zaxxer.hikari.HikariDataSource
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  #   url: jdbc:mysql://localhost:3306/unimed_dh?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
  #   username: root
  #   password: unimed123
  #   hikari:
  #     minimum-idle: 5
  #     maximum-pool-size: 20
  #     auto-commit: true
  #     idle-timeout: 30000
  #     pool-name: HikariCP
  #     max-lifetime: 1800000
  #     connection-timeout: 30000
  #     connection-test-query: SELECT 1

  # Jackson 配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

# 数字人服务特定配置
digital-human:
  python-api:
    # Python API 基础地址 - 请根据实际情况修改
    base-url: ${PYTHON_API_URL:http://localhost:8000}
    timeout: 30s
    connect-timeout: 10s
    read-timeout: 30s
    retry:
      max-attempts: 3
      delay: 1s
      multiplier: 2.0
  
  # 熔断器配置
  circuit-breaker:
    failure-rate-threshold: 50
    wait-duration-in-open-state: 30s
    sliding-window-size: 10
    minimum-number-of-calls: 5
    
  # 限流配置
  rate-limiter:
    limit-for-period: 10
    limit-refresh-period: 1s
    timeout-duration: 0s
    
  # 缓存配置
  cache:
    digital-human-ttl: 30
    configuration-ttl: 60
    key-prefix: "dh:"

# Sa-Token 配置
sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: true

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# 日志配置
logging:
  level:
    org.dromara.dh: debug
    org.springframework.web.reactive: info
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"