# 数字人微服务配置
# 此配置文件用于 Nacos 配置中心，请将内容复制到 Nacos 对应的配置中

# 数字人服务特定配置
digital-human:
  python-api:
    # Python API 基础地址
    base-url: ${PYTHON_API_URL:http://localhost:8080}
    # 请求超时时间
    timeout: 30s
    # 连接超时时间
    connect-timeout: 10s
    # 读取超时时间
    read-timeout: 30s
    # 重试配置
    retry:
      max-attempts: 3
      delay: 1s
      multiplier: 2.0

  # 熔断器配置
  circuit-breaker:
    # 失败率阈值 (50%)
    failure-rate-threshold: 50
    # 熔断器打开状态持续时间
    wait-duration-in-open-state: 30s
    # 滑动窗口大小
    sliding-window-size: 10
    # 最小调用次数
    minimum-number-of-calls: 5

  # 限流配置
  rate-limiter:
    # 每个周期允许的请求数
    limit-for-period: 10
    # 限流周期
    limit-refresh-period: 1s
    # 获取许可的超时时间
    timeout-duration: 0s

  # 缓存配置
  cache:
    # 数字人信息缓存时间 (分钟)
    digital-human-ttl: 30
    # 配置信息缓存时间 (分钟)
    configuration-ttl: 60
    # 缓存键前缀
    key-prefix: "dh:"
