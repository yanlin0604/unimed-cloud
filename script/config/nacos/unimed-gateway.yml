# 安全配置
security:
  # 不校验白名单
  ignore:
    whites:
      # 基础认证接口
      - /auth/code
      - /auth/logout
      - /auth/login
      - /auth/binding/*
      - /auth/register
      - /auth/tenant/list
      # API Token 相关接口
      - /auth/api-token/**
      - /auth/public-api-token/**
      # 资源服务
      - /resource/sms/code
      - /resource/sse/close
      # 接口文档
      - /*/v3/api-docs
      - /*/swagger-ui/**
      - /*/error
      - /csrf
      # 工作流
      - /warm-flow-ui/**
      # 数字人外部接口（使用自定义认证，不走 Sa-Token）
      - /dh/api/v1/dh/external/**
      # C端门户公开接口（无需登录）
      - /dh/portal/creation/templates
      - /dh/portal/dialect/**
      # C端门户认证接口
      - /dh/portal/auth/**
      # 慢病患者端认证接口
      - /chronic/chronic/patient/auth/**
      # 健康检查和监控
      - /actuator/**

spring:
  http:
    codecs:
      # 请求体最大大小（支持大文件上传）
      max-in-memory-size: 500MB
  cloud:
    # 网关配置
    gateway:
      # 打印请求日志(自定义)
      requestLog: true
      server:
        webflux:
          discovery:
            locator:
              lowerCaseServiceId: true
              enabled: true
          routes:
            # 认证中心
            - id: unimed-auth
              uri: lb://unimed-auth
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1

            # 代码生成
            - id: unimed-gen
              uri: lb://unimed-gen
              predicates:
                - Path=/tool/**
              filters:
                - StripPrefix=1
            # 系统模块
            - id: unimed-system
              uri: lb://unimed-system
              predicates:
                - Path=/system/**,/monitor/**
              filters:
                - StripPrefix=1
            # 资源服务
            - id: unimed-resource
              uri: lb://unimed-resource
              predicates:
                - Path=/resource/**
              filters:
                - StripPrefix=1
            # workflow服务
            - id: unimed-workflow
              uri: lb://unimed-workflow
              predicates:
                - Path=/workflow/**
              filters:
                - StripPrefix=1
            # 慢病管理服务 (端口 9208)
            - id: unimed-chronic
              uri: lb://unimed-chronic
              predicates:
                - Path=/chronic/**
              filters:
                - StripPrefix=1
            # warm-flow服务
            - id: warm-flow
              uri: lb://unimed-workflow
              predicates:
                - Path=/warm-flow-ui/**,/warm-flow/**
            # 演示服务
            - id: unimed-demo
              uri: lb://unimed-demo
              predicates:
                - Path=/demo/**
              filters:
                - StripPrefix=1
            # MQ演示服务
            - id: unimed-test-mq
              uri: lb://unimed-test-mq
              predicates:
                - Path=/test-mq/**
              filters:
                - StripPrefix=1
            # C端门户接口 —— 必须在 dh-relay 通配之前，确保 /dh/portal/** 优先匹配到业务服务
            - id: unimed-dh-portal
              uri: lb://unimed-dh
              predicates:
                - Path=/dh/portal/**
            # 数字人中转服务
            - id: unimed-dh-relay
              uri: lb://unimed-dh-relay
              predicates:
                - Path=/dh/**
              filters:
                - StripPrefix=1
            # 数字人业务服务
            - id: unimed-dh
              uri: lb://unimed-dh
              predicates:
                - Path=/dh-core/**
              filters:
                - StripPrefix=1
    
